schema_version = "1.3"
artifacts = ["/app/page_register.csv", "/app/results.json"]

[task]
name = "obi/writing-b52-a9-manuscript-page-ledger-recompute"
description = "Re-paginate a 30-passage manuscript after two edit reads whose decisions are logged in the readers' own words: read each decision as accepted, deferred or withdrawn (including revised line counts and a return to an earlier call), sum every accepted edit per passage, hold any passage its cuts would erase at one line, and record the page each passage starts on and how it sits there"
authors = []
keywords = ["harbor", "b52", "writing", "non-connector", "offline", "ledger_recomputation"]

[metadata]
source_config = "infra/task-harness/configs/shannon-200/task_writing_b52_a9_manuscript_page_ledger_recompute"
reward_shape = "core-gated weighted fraction over 9 equally weighted checks: any failed core check scores 0; otherwise the passing checks' weight; 1.0 only when every check passes. Eight core checks decide whether the page register and the five figures are right: register_header, register_trap_ps04, register_trap_ps07, register_trap_ps10, register_trap_ps20, register_trap_ps24, register_rows and results_figures. One incidental check, results_keyset, costs its weight share when missed rather than zeroing substantively correct work, and a strict pass requires it too."

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
