schema_version = "1.3"
artifacts = ["/app/page_register.csv", "/app/results.json"]

[task]
name = "obi/writing-b52-a9-manuscript-page-ledger-recompute"
description = "Re-paginate a 40-passage manuscript after two edit reads: order the flag ledger by its draft lines and join a passage flagged in two stretches, read each of 58 decisions out of a 19-message mail thread that quotes its own history (accepted, deferred or withdrawn; revised counts in words, ditto and same-call references, a return to an earlier call), sum every accepted edit per passage, hold any passage its cuts would erase at one line, and record the page each passage starts on and how it sits there"
authors = []
keywords = ["harbor", "b52", "writing", "non-connector", "offline", "ledger_recomputation"]

[metadata]
source_config = "infra/task-harness/configs/shannon-200/task_writing_b52_a9_manuscript_page_ledger_recompute"
reward_shape = "core-gated weighted fraction over 13 equally weighted checks: any failed core check scores 0; otherwise the passing checks' weight; 1.0 only when every check passes. Twelve core checks decide whether the page register and the five figures are right: register_header, nine isolated trap rows (register_trap_ps04, _ps07, _ps10, _ps16, _ps17, _ps20, _ps24, _ps31, _ps34), register_rows and results_figures. One incidental check, results_keyset, costs its weight share when missed rather than zeroing substantively correct work, and a strict pass requires it too."

[verifier]
timeout_sec = 600.0
collect = []

[verifier.env]

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 1200.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
